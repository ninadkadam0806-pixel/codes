<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Block vs Inline Elements</title>
</head>
<body>

    <h1>Block vs Inline Elements</h1>

    <!-- Block elements -->
    <div>
        <h2>Block Elements</h2>
        <p>Paragraph one starts on a new line.</p>
        <p>Paragraph two also starts on a new line.</p>
    </div>

    <!-- Inline elements -->
    <h2>Inline Elements</h2>

    <p>
        This is <b>bold</b>, this is <i>italic</i>,
        and this is <span style="color: rgb(144, 0, 255);">important text</span>.
        Inline elements remain within the same line when space permits.
    </p>

</body>
</html>
